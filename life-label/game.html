<script>
"use strict";

// ============================================================
//  人生标签交易所：试用期 —— 完整单班次游戏循环
//  Canvas 2D 渲染，基准坐标系 1280 × 720
//  规则层严格遵守 TECH_SPEC.md §2 状态机
// ============================================================

const BASE_W = 1280, BASE_H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let scaleX = 1, scaleY = 1;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scaleX = window.innerWidth / BASE_W;
  scaleY = window.innerHeight / BASE_H;
}
window.addEventListener('resize', resize);
resize();

// ---------- 数据容器 ----------
const DATA = { config: null, cases: null, flows: null, shifts: null, tags: null, endings: null };
let GAMECONFIG = null;
let tagsById = {}, casesById = {}, flowsById = {}, shiftsById = {};

// ---------- 颜色常量 ----------
const COLORS = {
  desk: '#2A2017', stackBg: '#31271A', deskBg: '#2E2315', trackBg: '#251D10',
  divider: '#1A1208', paper: '#D4C5A9', paperBack: '#C8B89A',
  brandRed: '#D32F2F', brandRedDark: '#B71C1C', gold: '#F9A825',
  ledBg: '#080C08', ledUp: '#00E676', ledDown: '#FF4444'
};

// 分区几何
const AREA_TOP = 52;
const AREA_H = 544;
const AREA_BOTTOM = AREA_TOP + AREA_H;     // 596
const FLOW_TOP = 600;
const FLOW_H = 108;

// 展开案件卡几何
const CARD_W = 480, CARD_H = 340;
const CARD_X = 196 + (752 - CARD_W) / 2;     // 332
const CARD_Y = AREA_TOP + (AREA_H - CARD_H) / 2; // 154

const FLOW_VISUAL = {
  flow_big_company:       { color: '#1565C0', type: 'corp' },
  flow_startup:           { color: '#E64A19', type: 'startup' },
  flow_romance:           { color: '#AD1457', type: 'romance' },
  flow_traffic:           { color: '#6A1B9A', type: 'viral' },
  flow_system:            { color: '#2E7D32', type: 'system' },
  flow_academia:          { color: '#3949AB', type: 'academia' },
  flow_overseas:          { color: '#0097A7', type: 'overseas' },
  flow_downshift:         { color: '#6D4C41', type: 'downshift' },
  flow_self_employed:     { color: '#00897B', type: 'indie' },
  flow_knowledge_economy: { color: '#F57C00', type: 'knowledge' }
};
const FLOW_ORDER = [
  'flow_big_company', 'flow_startup', 'flow_romance', 'flow_traffic',
  'flow_system', 'flow_academia', 'flow_overseas', 'flow_downshift',
  'flow_self_employed', 'flow_knowledge_economy'
];

function computeFlowZones(availableIds) {
  const ids = FLOW_ORDER.filter(id => flowsById[id]);
  const n = ids.length;
  const margin = 8, gap = 6;
  const w = (BASE_W - margin * 2 - gap * (n - 1)) / n;
  return ids.map((id, i) => ({
    id, x: margin + i * (w + gap), y: FLOW_TOP, w, h: FLOW_H,
    available: availableIds.includes(id)
  }));
}

const LABEL_COLORS = {
  temporal:   { bg: '#FBE9E7', border: '#F4511E', text: '#BF360C' },
  capability: { bg: '#E3F2FD', border: '#1E88E5', text: '#0D47A1' },
  trait:      { bg: '#E8F5E9', border: '#43A047', text: '#1B5E20' },
  social:     { bg: '#F3E5F5', border: '#8E24AA', text: '#4A148C' },
  risk:       { bg: '#FFEBEE', border: '#E53935', text: '#B71C1C' },
  viral:      { bg: '#FCE4EC', border: '#F06292', text: '#880E4F' },
  hidden:     { bg: '#EEEEEE', border: '#9E9E9E', text: '#757575' },
  revealed:   { bg: '#FFCDD2', border: '#E53935', text: '#B71C1C' },
  revealedGood:{ bg: '#E8F5E9', border: '#43A047', text: '#1B5E20' }
};
const TEMPORAL_TAGS = new Set(['tag_young', 'tag_35plus', 'tag_45plus', 'tag_gen_z', 'tag_gap_year']);
const SOCIAL_TAGS = new Set(['tag_presentable','tag_family_readable','tag_visible_assets','tag_local_hukou','tag_party_member','tag_stable','tag_system_exp']);

function tagType(tagId) {
  if (TEMPORAL_TAGS.has(tagId)) return 'temporal';
  if (SOCIAL_TAGS.has(tagId)) return 'social';
  const t = tagsById[tagId];
  if (!t) return 'capability';
  switch (t.uiTone) {
    case 'valuable': return 'capability';
    case 'risk':     return 'risk';
    case 'strange':  return 'viral';
    case 'normal':   return 'trait';
    default:         return 'capability';
  }
}

// ---------- 绘制工具 ----------
function roundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function darken(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 - amount)); g = Math.round(g * (1 - amount)); b = Math.round(b * (1 - amount));
  return `rgb(${r},${g},${b})`;
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeIn(t) { return t * t; }

function wrapText(c, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = Array.from(text);
  let line = '', lines = 0;
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (c.measureText(test).width > maxWidth && line !== '') {
      c.fillText(line, x, y);
      line = chars[i]; y += lineHeight; lines++;
      if (maxLines && lines >= maxLines - 1 && i < chars.length - 1) {
        let rest = chars.slice(i).join('');
        while (c.measureText(rest + '…').width > maxWidth && rest.length > 1) rest = rest.slice(0, -1);
        c.fillText(rest + '…', x, y);
        return y;
      }
    } else line = test;
  }
  c.fillText(line, x, y);
  return y;
}

// ============================================================
//  规则层：PlayerState 与操作
//  严格遵守 TECH_SPEC.md §2 / §3 / §5
// ============================================================

const ACTION_IDS = ['selectCase','inspectCase','revealHiddenTag','shipCase','returnCase','buyTagForCase','sellTagFromCase','endShift'];
let STATE = null;

function zeroStats() {
  return { casesSelected:0, casesInspected:0, hiddenTagsRevealed:0, casesShipped:0,
    casesReturned:0, casesAutoReturned:0, callbacksResolved:0, failedShipments:0,
    performancePenalties:0, depositLostTotal:0 };
}

function logEvent(state, eventType, message, extra) {
  extra = extra || {};
  state.eventLog.push({
    id: 'ev_' + (state.eventLog.length + 1),
    turnIndex: state.turnIndex, phase: state.phase,
    shiftId: state.currentShiftId, caseId: extra.caseId || null,
    actionId: extra.actionId || null, eventType, message,
    payload: extra.payload || {}, createdAt: new Date().toISOString()
  });
}

function newPlayerState() {
  return {
    runId: 'run_' + Date.now(),
    runStatus: 'active', phase: 'RUN_INIT',
    currentShiftId: null, currentShiftOrder: 0, completedShiftIds: [],
    depositTags: { current: GAMECONFIG.initialDepositTags, max: GAMECONFIG.maxDepositTags },
    resources: clone(GAMECONFIG.defaultShiftResources),
    selectedCaseId: null, activeCaseIds: [], runtimeCases: {},
    pendingCallbacks: [], readyCallbackIds: [],
    shiftStats: { shipped:0, returned:0, autoReturned:0 },
    stats: zeroStats(), lastActionResult: null, finalReport: null,
    shiftSummary: null, reviewQueue: [],
    eventLog: [], turnIndex: 0
  };
}

function setPhase(state, phase) { state.phase = phase; }

function actionCost(state, actionId) {
  const shift = shiftsById[state.currentShiftId];
  if (shift && shift.actionCosts && shift.actionCosts[actionId]) return shift.actionCosts[actionId];
  if (GAMECONFIG.defaultActionCosts && GAMECONFIG.defaultActionCosts[actionId]) return GAMECONFIG.defaultActionCosts[actionId];
  return {};
}
function canAfford(state, cost) {
  for (const k in cost) { if ((state.resources[k] || 0) + cost[k] < 0) return false; }
  return true;
}
function applyCost(state, cost) {
  for (const k in cost) state.resources[k] = (state.resources[k] || 0) + cost[k];
}
function shiftActionOpen(state, actionId) {
  const shift = shiftsById[state.currentShiftId];
  return shift.availableActionIds.includes(actionId);
}
function shipFlowsFor(state, caseId) {
  const shift = shiftsById[state.currentShiftId];
  const cs = casesById[caseId];
  return shift.availableFlowIds.filter(f => cs.availableFlowIds.includes(f) && cs.flowResults[f]);
}

// §4.3 押金标签变化统一函数
function applyDepositDelta(state, delta, reason) {
  if (delta === 0) return;
  state.depositTags.current += delta;
  if (state.depositTags.current > state.depositTags.max) state.depositTags.current = state.depositTags.max;
  if (delta < 0) { state.stats.depositLostTotal += Math.abs(delta); queueDepositAnim(delta); }
  // §6.4 押金剩余 2 枚时自动出现一次
  if (state.depositTags.current === 2 && !state._depositBubbleShown) {
    state._depositBubbleShown = true; state._depositBubblePending = true;
  }
  logEvent(state, 'deposit_changed', reason + ' ' + delta, { payload: { delta, reason } });
  if (state.depositTags.current <= 0) {
    state.depositTags.current = 0;
    state.runStatus = 'failed';
    logEvent(state, 'run_failed', '押金标签归零');
    setPhase(state, 'RUN_FAILED');
  }
}

function fail(state, msg) { showToast(msg); return { ok: false, message: msg }; }

function setActionResult(state, res) {
  state.lastActionResult = res;
  setPhase(state, 'ACTION_RESULT');
  return res;
}

// §5.1 startRun
function startRun() {
  STATE = newPlayerState();
  logEvent(STATE, 'run_started', '新局开始');
  enterShift(STATE, GAMECONFIG.firstShiftId);
}

// §2.5 enterShift（系统动作）
function enterShift(state, shiftId) {
  const shift = shiftsById[shiftId];
  state.currentShiftId = shiftId;
  state.currentShiftOrder = shift.order;
  state.resources = Object.assign(clone(GAMECONFIG.defaultShiftResources), clone(shift.resources));
  state.activeCaseIds = shift.caseIds.slice();
  state.selectedCaseId = null;
  state.shiftStats = { shipped:0, returned:0, autoReturned:0 };
  state.shiftSummary = null;
  for (const id of shift.caseIds) {
    if (!state.runtimeCases[id]) {
      state.runtimeCases[id] = {
        caseId: id, status: 'UNTOUCHED', backgroundRevealed: false,
        revealedHiddenTagIds: [], addedTagIds: [], removedTagIds: [],
        shippedToFlowId: null, shippedAtShiftId: null, shippedAtShiftOrder: null,
        outcome: null, returnedAtShiftId: null, returnedAtShiftOrder: null,
        autoReturned: false, callbackResolvedAtShiftId: null
      };
    }
  }
  // §6.2 回单到期检查
  state.readyCallbackIds = [];
  for (const cb of state.pendingCallbacks) {
    if (cb.status === 'pending' && cb.dueShiftOrder === state.currentShiftOrder) {
      cb.status = 'ready';
      const rc = state.runtimeCases[cb.caseId];
      if (rc) rc.status = 'CALLBACK_READY';
      state.readyCallbackIds.push(cb.id);
      logEvent(state, 'callback_ready', '回单到期 ' + cb.caseId, { caseId: cb.caseId });
    }
  }
  logEvent(state, 'shift_entered', '进入班次 ' + shiftId);
  state._mascotPending = true;   // §6.4 每班开始时显示一次
  setPhase(state, 'SHIFT_START');
  buildScene(state);
}

// beginShiftWork（玩家在班前页点击）
function beginShiftWork(state) {
  logEvent(state, 'shift_started', '开始处理 ' + state.currentShiftId);
  if (state.readyCallbackIds.length > 0) {
    enterCallbackReview(state, 'CALLBACK_REVIEW');
  } else {
    setPhase(state, 'SHIFT_ACTIVE');
  }
}

function sortCallbacks(state, ids) {
  return ids.slice().sort((a, b) => {
    const ca = state.pendingCallbacks.find(c => c.id === a);
    const cb = state.pendingCallbacks.find(c => c.id === b);
    const da = ca.dueShiftOrder === 'final' ? 9999 : ca.dueShiftOrder;
    const db = cb.dueShiftOrder === 'final' ? 9999 : cb.dueShiftOrder;
    if (da !== db) return da - db;
    if (ca.createdAtShiftOrder !== cb.createdAtShiftOrder) return ca.createdAtShiftOrder - cb.createdAtShiftOrder;
    return ca.caseId < cb.caseId ? -1 : 1;
  });
}

function enterCallbackReview(state, phase) {
  let ids;
  if (phase === 'FINAL_CALLBACK_REVIEW') {
    ids = state.pendingCallbacks.filter(c => c.dueShiftOrder === 'final' && c.status !== 'resolved').map(c => c.id);
    for (const id of ids) {
      const cb = state.pendingCallbacks.find(c => c.id === id);
      cb.status = 'ready';
      const rc = state.runtimeCases[cb.caseId];
      if (rc) rc.status = 'CALLBACK_READY';
    }
  } else {
    ids = state.readyCallbackIds.slice();
  }
  state.reviewQueue = sortCallbacks(state, ids);
  setPhase(state, phase);
}

// §5.2 selectCase
function selectCase(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return fail(state, '当前不可选择案件');
  if (!state.activeCaseIds.includes(caseId)) return fail(state, '案件不在待处理区');
  const rc = state.runtimeCases[caseId];
  const terminal = ['RETURNED','SHIPPED_PENDING_CALLBACK','CALLBACK_READY','CALLBACK_RESOLVED','LOCKED'];
  if (terminal.includes(rc.status)) return fail(state, '案件已不可操作');
  state.selectedCaseId = caseId;
  state.stats.casesSelected++;
  logEvent(state, 'case_selected', '选择案件 ' + caseId, { caseId, actionId: 'selectCase' });
  openActiveCard(state, caseId);
  return { ok: true };
}

// §5.3 inspectCase / 扒底
function canInspect(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return false;
  if (!shiftActionOpen(state, 'inspectCase')) return false;
  const cs = casesById[caseId]; if (!cs) return false;
  if (!state.activeCaseIds.includes(caseId)) return false;
  const rc = state.runtimeCases[caseId];
  if (!['UNTOUCHED','PARTIALLY_REVEALED','FULLY_REVEALED'].includes(rc.status)) return false;
  if (rc.backgroundRevealed) return false;
  return canAfford(state, actionCost(state, 'inspectCase'));
}
function inspectCase(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return fail(state, '当前不可扒底');
  if (!shiftActionOpen(state, 'inspectCase')) return fail(state, '本班未开放扒底');
  const cs = casesById[caseId]; if (!cs) return fail(state, '案件不存在');
  if (!state.activeCaseIds.includes(caseId)) return fail(state, '案件不可操作');
  const rc = state.runtimeCases[caseId];
  if (!['UNTOUCHED','PARTIALLY_REVEALED','FULLY_REVEALED'].includes(rc.status)) return fail(state, '案件状态不允许');
  if (rc.backgroundRevealed) return fail(state, '案件已扒底');
  const cost = actionCost(state, 'inspectCase');
  if (!canAfford(state, cost)) return fail(state, '调查机会不足');
  applyCost(state, cost);
  rc.backgroundRevealed = true;
  if (rc.status === 'UNTOUCHED') rc.status = 'INSPECTED';
  state.stats.casesInspected++;
  state.turnIndex++;
  if (UI.activeCard) { UI.activeCard.flipTarget = 1; }   // 翻到底细面
  logEvent(state, 'case_inspected', cs.backgroundText, { caseId, actionId: 'inspectCase' });
  return setActionResult(state, { ok:true, actionId:'inspectCase', caseId,
    message: cs.backgroundText, detailText: '扒底完成 · 调查机会 -1',
    resourceDeltas: cost, nextPhaseAfterClose: 'SHIFT_ACTIVE' });
}

// §5.4 revealHiddenTag / 揭标
function nextHiddenTag(state, caseId) {
  const cs = casesById[caseId];
  const rc = state.runtimeCases[caseId];
  const remaining = cs.hiddenTags.filter(h => !rc.revealedHiddenTagIds.includes(h.id))
    .sort((a, b) => a.order - b.order);
  return remaining[0] || null;
}
function canReveal(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return false;
  if (!shiftActionOpen(state, 'revealHiddenTag')) return false;
  const cs = casesById[caseId]; if (!cs) return false;
  if (!state.activeCaseIds.includes(caseId)) return false;
  const rc = state.runtimeCases[caseId];
  if (['RETURNED','SHIPPED_PENDING_CALLBACK','CALLBACK_READY','CALLBACK_RESOLVED','LOCKED'].includes(rc.status)) return false;
  if (!nextHiddenTag(state, caseId)) return false;
  return canAfford(state, actionCost(state, 'revealHiddenTag'));
}
function revealHiddenTag(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return fail(state, '当前不可揭标');
  if (!shiftActionOpen(state, 'revealHiddenTag')) return fail(state, '本班未开放揭标');
  const cs = casesById[caseId]; if (!cs) return fail(state, '案件不存在');
  if (!state.activeCaseIds.includes(caseId)) return fail(state, '案件不可操作');
  const entry = nextHiddenTag(state, caseId);
  if (!entry) return fail(state, '没有可揭露的底标');
  const cost = actionCost(state, 'revealHiddenTag');
  if (!canAfford(state, cost)) return fail(state, '调查机会不足');
  applyCost(state, cost);
  const rc = state.runtimeCases[caseId];
  rc.revealedHiddenTagIds.push(entry.id);
  const allRevealed = cs.hiddenTags.every(h => rc.revealedHiddenTagIds.includes(h.id));
  rc.status = allRevealed ? 'FULLY_REVEALED' : 'PARTIALLY_REVEALED';
  state.stats.hiddenTagsRevealed++;
  state.turnIndex++;
  const tag = tagsById[entry.tagId];
  const msg = entry.revealText || (tag ? tag.displayName : entry.tagId);
  if (UI.activeCard) { UI.activeCard.flipTarget = 0; UI.revealPop = { caseId, id: entry.id, t: 0 }; }
  logEvent(state, 'case_hidden_tag_revealed', msg, { caseId, actionId: 'revealHiddenTag' });
  return setActionResult(state, { ok:true, actionId:'revealHiddenTag', caseId,
    message: '揭标：' + (tag ? '【' + tag.displayName + '】' : '') + ' ' + msg,
    detailText: '调查机会 -1', nextPhaseAfterClose: 'SHIFT_ACTIVE' });
}

// §5.5 shipCase / 出货
function canShip(state, caseId, flowId) {
  if (state.phase !== 'SHIFT_ACTIVE') return { ok:false, reason:'当前不可出货' };
  if (!shiftActionOpen(state, 'shipCase')) return { ok:false, reason:'本班未开放出货' };
  const cs = casesById[caseId]; if (!cs) return { ok:false, reason:'案件不存在' };
  if (!state.activeCaseIds.includes(caseId)) return { ok:false, reason:'案件不可操作' };
  const shift = shiftsById[state.currentShiftId];
  if (!shift.availableFlowIds.includes(flowId)) return { ok:false, reason:'该柜台本班未开放' };
  if (!cs.availableFlowIds.includes(flowId) || !cs.flowResults[flowId]) return { ok:false, reason:'该流向不接收此案件' };
  const rc = state.runtimeCases[caseId];
  if (['RETURNED','SHIPPED_PENDING_CALLBACK','CALLBACK_READY','CALLBACK_RESOLVED','LOCKED'].includes(rc.status))
    return { ok:false, reason:'案件已不可出货' };
  if (shift.rules.requiresInspectionBeforeShipping && !rc.backgroundRevealed)
    return { ok:false, reason:'本班要求：出货前必须先扒底' };
  if (shift.rules.requiresRevealBeforeShipping && rc.revealedHiddenTagIds.length === 0)
    return { ok:false, reason:'本班要求：出货前必须先揭标' };
  if (!canAfford(state, actionCost(state, 'shipCase'))) return { ok:false, reason:'资源不足' };
  return { ok:true };
}
function shipCase(state, caseId, flowId) {
  const chk = canShip(state, caseId, flowId);
  if (!chk.ok) return fail(state, chk.reason);
  const cs = casesById[caseId];
  const fr = cs.flowResults[flowId];
  applyCost(state, actionCost(state, 'shipCase'));
  const rc = state.runtimeCases[caseId];
  rc.status = 'SHIPPED_PENDING_CALLBACK';
  rc.shippedToFlowId = flowId;
  rc.shippedAtShiftId = state.currentShiftId;
  rc.shippedAtShiftOrder = state.currentShiftOrder;
  rc.outcome = fr.outcome;
  state.activeCaseIds = state.activeCaseIds.filter(id => id !== caseId);

  let due;
  if (fr.callbackDelay === 'final') due = 'final';
  else due = state.currentShiftOrder + fr.callbackDelay;
  const cb = {
    id: 'cb_' + caseId + '_' + state.currentShiftOrder,
    caseId, flowId, outcome: fr.outcome,
    callbackText: fr.callbackText, longTermText: fr.longTermText || null,
    depositDelta: fr.depositDelta, resultTags: fr.resultTags || [],
    createdAtShiftId: state.currentShiftId, createdAtShiftOrder: state.currentShiftOrder,
    dueShiftOrder: due, status: fr.callbackDelay === 0 ? 'ready' : 'pending',
    resolvedAtShiftOrder: null
  };
  state.pendingCallbacks.push(cb);
  state.stats.casesShipped++;
  state.shiftStats.shipped++;
  state.selectedCaseId = null;
  state.turnIndex++;
  logEvent(state, 'case_shipped', '出货 ' + caseId + ' → ' + flowId, { caseId, actionId:'shipCase', payload:{ flowId } });

  startStampAnim(state, flowId, caseId);

  const nextPhase = (fr.callbackDelay === 0) ? 'CALLBACK_REVIEW' : 'SHIFT_ACTIVE';
  return setActionResult(state, { ok:true, actionId:'shipCase', caseId, flowId,
    message: fr.immediateText, detailText: '已加入跟单板', nextPhaseAfterClose: nextPhase });
}

// §5.6 returnCase / 退货
function canReturn(state, caseId) {
  if (state.phase !== 'SHIFT_ACTIVE') return false;
  if (!shiftActionOpen(state, 'returnCase')) return false;
  const cs = casesById[caseId]; if (!cs) return false;
  if (!state.activeCaseIds.includes(caseId)) return false;
  const rc = state.runtimeCases[caseId];
  if (['RETURNED','SHIPPED_PENDING_CALLBACK','CALLBACK_READY','CALLBACK_RESOLVED','LOCKED'].includes(rc.status)) return false;
  return canAfford(state, actionCost(state, 'returnCase'));
}
function returnCase(state, caseId) {
  if (!canReturn(state, caseId)) return fail(state, '当前不可退货');
  const cs = casesById[caseId];
  const ret = cs.returnResult;
  applyCost(state, actionCost(state, 'returnCase'));
  const rc = state.runtimeCases[caseId];
  rc.status = 'RETURNED';
  rc.returnedAtShiftId = state.currentShiftId;
  rc.returnedAtShiftOrder = state.currentShiftOrder;
  rc.autoReturned = false;
  state.activeCaseIds = state.activeCaseIds.filter(id => id !== caseId);
  state.stats.casesReturned++;
  state.shiftStats.returned++;
  state.selectedCaseId = null;
  state.turnIndex++;
  logEvent(state, 'case_returned', '退货 ' + caseId, { caseId, actionId:'returnCase' });
  applyDepositDelta(state, ret.depositDelta, 'returnCase');
  startReturnAnim(state, caseId);
  if (state.phase === 'RUN_FAILED') return { ok:true };
  return setActionResult(state, { ok:true, actionId:'returnCase', caseId,
    message: ret.immediateText, detailText: '案卷退回来货区',
    nextPhaseAfterClose: state.depositTags.current <= 0 ? 'RUN_FAILED' : 'SHIFT_ACTIVE' });
}

// §5.7 acknowledgeCallback
function acknowledgeCallback(state) {
  if (state.phase !== 'CALLBACK_REVIEW' && state.phase !== 'FINAL_CALLBACK_REVIEW') return;
  const id = state.reviewQueue[0];
  if (!id) return;
  const cb = state.pendingCallbacks.find(c => c.id === id);
  if (!cb || cb.status !== 'ready') { state.reviewQueue.shift(); return; }
  const rc = state.runtimeCases[cb.caseId];
  rc.status = 'CALLBACK_RESOLVED';
  rc.callbackResolvedAtShiftId = (cb.dueShiftOrder === 'final') ? 'final' : state.currentShiftId;
  cb.status = 'resolved';
  cb.resolvedAtShiftOrder = (cb.dueShiftOrder === 'final') ? 'final' : state.currentShiftOrder;
  state.stats.callbacksResolved++;
  if (cb.outcome === 'failure') state.stats.failedShipments++;
  state.turnIndex++;
  logEvent(state, 'callback_resolved', cb.callbackText, { caseId: cb.caseId, payload:{ depositDelta: cb.depositDelta } });
  applyDepositDelta(state, cb.depositDelta, 'callback');
  state.reviewQueue.shift();
  if (state.phase === 'RUN_FAILED') return;       // §8.1 中断
  if (state.reviewQueue.length === 0) {
    if (state.phase === 'CALLBACK_REVIEW') { setPhase(state, 'SHIFT_ACTIVE'); }
    else { finishFinalCallbackReview(state); }
  }
}

function finishFinalCallbackReview(state) {
  setPhase(state, 'ENDING_BUILD');
  buildEnding(state);
}

// §5.10 endShift / 收班
function canEndShift(state) {
  if (state.phase !== 'SHIFT_ACTIVE') return false;
  const shift = shiftsById[state.currentShiftId];
  if (shift.rules.unprocessedCasePolicy === 'block_end' && state.activeCaseIds.length > 0) return false;
  return true;
}
function endShift(state) {
  if (state.phase !== 'SHIFT_ACTIVE') return fail(state, '当前不可收班');
  const shift = shiftsById[state.currentShiftId];
  const policy = shift.rules.unprocessedCasePolicy;
  if (policy === 'block_end' && state.activeCaseIds.length > 0)
    return fail(state, '仍有未处理案件，无法收班');

  // 自动退货
  if (policy === 'auto_return') {
    const remaining = state.activeCaseIds.slice();
    for (const id of remaining) {
      const cs = casesById[id];
      const rc = state.runtimeCases[id];
      rc.status = 'RETURNED'; rc.autoReturned = true;
      rc.returnedAtShiftId = state.currentShiftId; rc.returnedAtShiftOrder = state.currentShiftOrder;
      state.activeCaseIds = state.activeCaseIds.filter(x => x !== id);
      state.stats.casesAutoReturned++; state.shiftStats.autoReturned++;
      logEvent(state, 'case_auto_returned', '自动退货 ' + id, { caseId: id });
      applyDepositDelta(state, cs.returnResult.depositDelta, 'autoReturn');
      if (state.phase === 'RUN_FAILED') return { ok:true };
    }
  }

  // 班次绩效
  const perfResults = [];
  let penaltiesApplied = 0;
  const cap = shift.rules.performancePenaltyCap;
  const processed = state.shiftStats.shipped + state.shiftStats.returned + state.shiftStats.autoReturned;
  for (const rule of (shift.performanceRules || [])) {
    let pass = true;
    if (rule.type === 'min_shipped_cases') pass = state.shiftStats.shipped >= rule.target;
    else if (rule.type === 'max_returned_cases') pass = (state.shiftStats.returned + state.shiftStats.autoReturned) <= rule.target;
    else if (rule.type === 'required_cases_processed') pass = processed >= rule.target;
    perfResults.push({ pass, text: pass ? (rule.passText || '达标') : rule.failText });
    if (!pass && penaltiesApplied < cap) {
      applyDepositDelta(state, rule.depositDelta, 'performance');
      state.stats.performancePenalties++; penaltiesApplied++;
      logEvent(state, 'performance_penalty_applied', rule.failText);
      if (state.phase === 'RUN_FAILED') return { ok:true };
    }
  }

  if (!state.completedShiftIds.includes(state.currentShiftId))
    state.completedShiftIds.push(state.currentShiftId);

  state.shiftSummary = {
    shiftId: state.currentShiftId,
    title: shift.summaryTitle || shift.displayName,
    shipped: state.shiftStats.shipped, returned: state.shiftStats.returned,
    autoReturned: state.shiftStats.autoReturned, perfResults,
    depositRemaining: state.depositTags.current
  };
  logEvent(state, 'shift_ended', '收班 ' + state.currentShiftId);
  setPhase(state, 'SHIFT_SUMMARY');
  return { ok:true };
}

// §5.11 / §5.12
function startNextShift(state) {
  const shift = shiftsById[state.currentShiftId];
  if (!shift.nextShiftId) return;
  enterShift(state, shift.nextShiftId);
}
function enterFinalCallbacksOrEnding(state) {
  const hasFinal = state.pendingCallbacks.some(c => c.dueShiftOrder === 'final' && c.status !== 'resolved');
  if (hasFinal) { enterCallbackReview(state, 'FINAL_CALLBACK_REVIEW'); }
  else { setPhase(state, 'ENDING_BUILD'); buildEnding(state); }
}

// §5.13 buildEnding
function buildEnding(state) {
  if (state.depositTags.current <= 0) { setPhase(state, 'RUN_FAILED'); return; }
  const cond = (e) => {
    const c = e.conditions || {};
    if (c.requiredRunStatus && state.runStatus !== c.requiredRunStatus) return false;
    if (c.minDepositTags != null && state.depositTags.current < c.minDepositTags) return false;
    if (c.maxDepositTags != null && state.depositTags.current > c.maxDepositTags) return false;
    if (c.minCompletedShifts != null && state.completedShiftIds.length < c.minCompletedShifts) return false;
    if (c.maxFailedShipments != null && state.stats.failedShipments > c.maxFailedShipments) return false;
    if (c.maxPerformancePenalties != null && state.stats.performancePenalties > c.maxPerformancePenalties) return false;
    return true;
  };
  const sorted = DATA.endings.slice().sort((a, b) => a.priority - b.priority);
  let chosen = sorted.find(cond);
  if (!chosen) chosen = DATA.endings.find(e => e.id === GAMECONFIG.defaultEndingId);
  state.finalReport = {
    endingId: chosen.id, title: chosen.title, reportHeader: chosen.reportHeader,
    bodyText: chosen.bodyText, depositTagsRemaining: state.depositTags.current,
    completedShiftCount: state.completedShiftIds.length, stats: clone(state.stats),
    resultTags: chosen.resultTags || []
  };
  state.runStatus = 'completed';
  logEvent(state, 'ending_built', chosen.id);
  setPhase(state, 'ENDING_DISPLAY');
}

function restartRun() { startRun(); }

// ============================================================
//  数据校验（TECH_SPEC §10 / DATA_SCHEMA §0.6）
// ============================================================
function validateData() {
  const errs = [];
  const E = (m) => errs.push(m);
  const uniq = (arr, name) => { const s = new Set(); for (const x of arr) { if (s.has(x.id)) E(name + ' 重复 ID: ' + x.id); s.add(x.id); } };
  uniq(DATA.tags, 'tags'); uniq(DATA.flows, 'flows'); uniq(DATA.cases, 'cases'); uniq(DATA.shifts, 'shifts'); uniq(DATA.endings, 'endings');
  if (!shiftsById[GAMECONFIG.firstShiftId]) E('firstShiftId 不存在: ' + GAMECONFIG.firstShiftId);
  if (!DATA.endings.find(e => e.id === GAMECONFIG.defaultEndingId)) E('defaultEndingId 不存在: ' + GAMECONFIG.defaultEndingId);
  for (const sh of DATA.shifts) {
    if (sh.nextShiftId && !shiftsById[sh.nextShiftId]) E(sh.id + '.nextShiftId 不存在: ' + sh.nextShiftId);
    for (const cid of sh.caseIds) if (!casesById[cid]) E(sh.id + '.caseIds 缺失: ' + cid);
    for (const fid of sh.availableFlowIds) if (!flowsById[fid]) E(sh.id + '.availableFlowIds 缺失: ' + fid);
    for (const aid of sh.availableActionIds) if (!ACTION_IDS.includes(aid)) E(sh.id + ' 非法操作: ' + aid);
    for (const cid of sh.caseIds) {
      const cs = casesById[cid]; if (!cs) continue;
      const inter = sh.availableFlowIds.filter(f => cs.availableFlowIds.includes(f) && cs.flowResults[f]);
      if (inter.length === 0) E(sh.id + ' 中案件 ' + cid + ' 无可显示流向');
    }
  }
  for (const cs of DATA.cases) {
    for (const t of cs.visibleTagIds) if (!tagsById[t]) E(cs.id + '.visibleTagIds 缺失: ' + t);
    for (const h of cs.hiddenTags) if (!tagsById[h.tagId]) E(cs.id + '.hiddenTags.tagId 缺失: ' + h.tagId);
    for (const f of cs.availableFlowIds) {
      if (!flowsById[f]) E(cs.id + '.availableFlowIds 缺失: ' + f);
      if (!cs.flowResults[f]) E(cs.id + '.flowResults 未覆盖: ' + f);
    }
    for (const f in cs.flowResults) {
      const fr = cs.flowResults[f];
      if (!['success','failure','mixed','neutral'].includes(fr.outcome)) E(cs.id + '.' + f + ' 非法 outcome');
      if (!(fr.callbackDelay === 'final' || [0,1,2].includes(fr.callbackDelay))) E(cs.id + '.' + f + ' 非法 callbackDelay');
      if (typeof fr.depositDelta !== 'number') E(cs.id + '.' + f + ' depositDelta 非数字');
    }
    if (!cs.returnResult || typeof cs.returnResult.depositDelta !== 'number') E(cs.id + '.returnResult 非法');
  }
  return errs;
}

let lastTime = 0;
function updateAnims(dt) {
  if (UI.activeCard) {
    const a = UI.activeCard;
    a.slideT = Math.min(1, a.slideT + dt / 0.3);
    const e = easeOut(a.slideT);
    a.x = lerp(40, a.targetX, e);
    a.y = lerp(120, a.targetY, e);
    a.rotation = lerp(-3, a.rotTarget, e);
    a.flip += (a.flipTarget - a.flip) * Math.min(1, dt / 0.18);
    if (Math.abs(a.flip - a.flipTarget) < 0.01) a.flip = a.flipTarget;
  }
  if (UI.stamp) { UI.stamp.t += dt / UI.stamp.dur; if (UI.stamp.t >= 1) UI.stamp = null; }
  if (UI.returnAnim) { UI.returnAnim.t += dt / UI.returnAnim.dur; if (UI.returnAnim.t >= 1) UI.returnAnim = null; }
  if (UI.depositAnim) { UI.depositAnim.t += dt / UI.depositAnim.dur; if (UI.depositAnim.t >= 1) UI.depositAnim = null; }
  if (UI.revealPop) { UI.revealPop.t += dt / 0.35; if (UI.revealPop.t >= 1) UI.revealPop = null; }
  if (UI.toast) { UI.toast.t += dt; if (UI.toast.t > 2.4) UI.toast = null; }
  if (UI.mascotBubble) { UI.mascotBubble.t += dt; if (UI.mascotBubble.t > 6.5) UI.mascotBubble = null; }
}

function drawFlowIcon(type, x, y, size) {
  ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.fillStyle = 'none';
  ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const s = size;

      ctx.strokeRect(x + 4 + cc * (s - 8) / 3, y + 3 + r * (s - 6) / 2, (s - 8) / 3 - 2, (s - 6) / 2 - 2);
  } else if (type === 'startup') {
    ctx.beginPath(); ctx.moveTo(x + s / 2, y); ctx.lineTo(x + s * 0.72, y + s * 0.7); ctx.lineTo(x + s * 0.28, y + s * 0.7); ctx.closePath(); ctx.stroke();

    ctx.moveTo(x + s * 0.72, y + s * 0.55); ctx.lineTo(x + s * 0.88, y + s); ctx.stroke();
  } else if (type === 'romance') {

function drawStampLayer() {
  if (!UI.stamp) return;
  const s = UI.stamp; const t = s.t;
  const vis = FLOW_VISUAL[s.flowId];
  const cx = s.cardX + s.w / 2, cy = s.cardY + s.h / 2;
  // 案件卡（飞出阶段 t>0.6 滑出淡出）
  let drawX = s.cardX, drawY = s.cardY, alpha = 1, rot = 0;
  const zone = UI.flowZones.find(z => z.id === s.flowId);
  if (t > 0.6) {
    const k = easeIn((t - 0.6) / 0.4);
    const tx = zone ? (zone.x + zone.w / 2 - cx) : 0;
    const ty = zone ? (zone.y - cy) : 200;
    drawX += tx * k; drawY += ty * k; alpha = 1 - k; rot = k * 0.5;
  }
  ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(drawX + s.w / 2, drawY + s.h / 2); ctx.rotate(rot);
  ctx.fillStyle = COLORS.paper; roundRect(ctx, -s.w / 2, -s.h / 2, s.w, s.h, 3); ctx.fill();
  ctx.fillStyle = COLORS.brandRed; ctx.fillRect(-s.w / 2, -s.h / 2, s.w, 28);
  ctx.fillStyle = '#1A1A1A'; ctx.font = 'bold 18px "Noto Sans SC"'; ctx.textAlign = 'left';
  ctx.fillText(s.caseName, -s.w / 2 + 14, -s.h / 2 + 56);
  // 墨迹（t>0.3 出现）
  if (t > 0.3) {
    const ink = Math.min(1, (t - 0.3) / 0.15);
    ctx.save(); ctx.globalAlpha = 0.5 * alpha; ctx.translate(0, 10); ctx.scale(ink, ink); ctx.rotate(-0.15);
    ctx.fillStyle = vis.color; roundRect(ctx, -90, -34, 180, 68, 10); ctx.fill();
    ctx.globalAlpha = alpha; ctx.fillStyle = '#FFFFFF'; ctx.font = '15px "ZCOOL KuaiLe"'; ctx.textAlign = 'center';
    ctx.fillText(flowsById[s.flowId].shortName + ' 已出货', 0, 6); ctx.textAlign = 'left'; ctx.restore();
  }
  ctx.restore();
  // 下压的印章（t 0.1..0.45）
  if (t >= 0.1 && t < 0.5) {
    const k = (t - 0.1) / 0.4;
    const stampY = lerp(cy - 140, cy, easeIn(Math.min(1, k * 1.2)));
    const sc = t > 0.33 ? lerp(1, 1.2, (t - 0.33) / 0.17) : 1;
    ctx.save(); ctx.globalAlpha = 0.7; ctx.translate(cx, stampY); ctx.scale(sc, sc); ctx.rotate(-0.15);
    ctx.fillStyle = vis.color; roundRect(ctx, -80, -30, 160, 60, 10); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.font = '13px "ZCOOL KuaiLe"'; ctx.textAlign = 'center';
    ctx.fillText('已接收', 0, 5); ctx.textAlign = 'left'; ctx.restore();
  }
}

function bubbleWrapLines(text, maxW) {
  const chars = Array.from(text); let line = ''; const out = [];
  for (const ch of chars) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
function drawMascotBubble() {
  if (!UI.mascotBubble) return;
  const t = UI.mascotBubble.t;
  const appear = easeOut(Math.min(1, t / 0.2));
  const alpha = t > 5.9 ? Math.max(0, 1 - (t - 5.9) / 0.6) : 1;
  ctx.font = '12px "ZCOOL KuaiLe"';
  const lines = bubbleWrapLines(UI.mascotBubble.text, 240);
  let tw = 0; for (const l of lines) tw = Math.max(tw, ctx.measureText(l).width);
  const padX = 12, padY = 10, lh = 18;
  const bw = tw + padX * 2, bh = lines.length * lh + padY * 2;
  const bx = 210, by = 58;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(bx, by); ctx.scale(appear, appear); ctx.translate(-bx, -by);
  // 指针（朝向状态栏标宝方向，上方）
  ctx.fillStyle = '#FAF7F0';
  ctx.beginPath(); ctx.moveTo(bx + 16, by); ctx.lineTo(bx + 6, by - 11); ctx.lineTo(bx + 34, by); ctx.closePath(); ctx.fill();
  roundRect(ctx, bx, by, bw, bh, 4); ctx.fill();
  ctx.strokeStyle = '#9E9E9E'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + 16, by); ctx.lineTo(bx + 6, by - 11); ctx.lineTo(bx + 34, by); ctx.stroke();
  ctx.fillStyle = '#1A1A1A'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + padX, by + padY + 13 + i * lh);

  clickTargets.push({ x: bx, y: by, w: bw, h: bh, fn: () => { UI.mascotBubble = null; } });
}

// ============================================================
//  主循环
// ============================================================
function drawFrame() {
  clickTargets = [];
  const state = STATE;
  if (!state || state.phase === 'TITLE') { drawTitle(); drawToast(); return; }
  switch (state.phase) {
    case 'SHIFT_START': drawShiftStart(state); break;
    case 'CALLBACK_REVIEW': drawCallbackReview(state, false); break;
    case 'FINAL_CALLBACK_REVIEW': drawCallbackReview(state, true); break;
    case 'SHIFT_ACTIVE': drawScene(state); break;
    case 'ACTION_RESULT': drawActionResult(state); break;
    case 'SHIFT_SUMMARY': drawShiftSummary(state); break;
    case 'ENDING_DISPLAY': drawEnding(state); break;
    case 'RUN_FAILED': drawRunFailed(state); break;
    case 'ENDING_BUILD': case 'RUN_INIT': drawScene(state); break;
    default: drawScene(state);
  }
  drawToast();
}

function gameLoop(ts) {
  const dt = lastTime ? Math.min(0.05, (ts - lastTime) / 1000) : 0.016;
  lastTime = ts;
  updateAnims(dt);
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  drawFrame();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  输入处理
// ============================================================
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / scaleX, y: (e.clientY - rect.top) / scaleY };
}
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

function cardLocal(card, px, py) {
  const cx = card.x + card.w / 2, cy = card.y + card.h / 2;
  const dx = px - cx, dy = py - cy;
  const a = card.rotation * Math.PI / 180;
  return { lx: dx * Math.cos(a) + dy * Math.sin(a), ly: -dx * Math.sin(a) + dy * Math.cos(a) };
}
function hitCardBody(card, p) {
  const { lx, ly } = cardLocal(card, p.x, p.y);
  return lx >= -card.w / 2 && lx <= card.w / 2 && ly >= -card.h / 2 && ly <= card.h / 2;
}
function hitCardTab(card, p) {
  const { lx, ly } = cardLocal(card, p.x, p.y);
  for (const r of cardTabRects(card)) {
    if (lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h) return r.key;
  }
  return null;
}

function handleClickTargets(p) {
  for (let i = clickTargets.length - 1; i >= 0; i--) {
    const t = clickTargets[i];
    if (pointInRect(p, t)) { t.fn(); return true; }
  }
  return false;
}

function onMouseDown(e) {
  const p = getCanvasPos(e); UI.mouse = p;
  const state = STATE;
  // 叠层按钮优先（基于上一帧 clickTargets）
  if (handleClickTargets(p)) return;
  if (!state || state.phase !== 'SHIFT_ACTIVE') return;

  // 1. 操作 Tab
  if (UI.activeCard) {
    const key = hitCardTab(UI.activeCard, p);
    if (key) { handleTab(state, key); return; }
  }
  // 2. 案件堆栈顶部
  const ids = state.activeCaseIds.filter(id => id !== state.selectedCaseId);
  if (ids.length > 0 && pointInRect(p, stackTopRect())) { selectCase(state, ids[0]); return; }
  // 3. 活动案件卡 → 开始拖拽
  if (UI.activeCard && UI.activeCard.slideT > 0.5 && hitCardBody(UI.activeCard, p)) {
    UI.drag.state = 'DRAGGING';
    UI.drag.offX = p.x - UI.activeCard.x; UI.drag.offY = p.y - UI.activeCard.y;
  }
}

function handleTab(state, key) {
  const caseId = UI.activeCard.caseId;
  const rc = state.runtimeCases[caseId];
  if (key === 'inspect') {
    if (rc.backgroundRevealed) { UI.activeCard.flipTarget = UI.activeCard.flipTarget > 0.5 ? 0 : 1; } // 翻面
    else inspectCase(state, caseId);
  } else if (key === 'reveal') {
    revealHiddenTag(state, caseId);
  } else if (key === 'return') {
    returnCase(state, caseId);
  }
}

function onMouseMove(e) {
  const p = getCanvasPos(e); UI.mouse = p;
  const state = STATE;
  stackHover = false;
  if (UI.drag.state === 'DRAGGING' && UI.activeCard) {
    UI.activeCard.x = p.x - UI.drag.offX;
    UI.activeCard.y = p.y - UI.drag.offY;
    UI.activeCard.slideT = 1;
    // 悬停目标
    UI.hoveredZone = null;
    if (pointInRect(p, returnBoxRect())) UI.hoveredZone = 'return';
    else for (const z of UI.flowZones) { if (z.available && pointInRect(p, z)) { UI.hoveredZone = z.id; break; } }
    canvas.style.cursor = 'grabbing';
    return;
  }
  // 光标反馈
  let cur = 'default';
  if (state && state.phase === 'SHIFT_ACTIVE') {
    if (UI.activeCard && hitCardTab(UI.activeCard, p)) cur = 'pointer';
    else if (UI.activeCard && hitCardBody(UI.activeCard, p)) cur = 'grab';
    else {
      const ids = state.activeCaseIds.filter(id => id !== state.selectedCaseId);
      if (ids.length > 0 && pointInRect(p, stackTopRect())) { cur = 'grab'; stackHover = true; }
    }
  }
  for (const t of clickTargets) { if (pointInRect(p, t)) { cur = 'pointer'; break; } }
  canvas.style.cursor = cur;
}

function onMouseUp(e) {
  const p = getCanvasPos(e); UI.mouse = p;
  const state = STATE;
  if (UI.drag.state !== 'DRAGGING' || !UI.activeCard) { UI.drag.state = 'IDLE'; return; }
  const caseId = UI.activeCard.caseId;
  const target = UI.hoveredZone;
  UI.drag.state = 'IDLE'; UI.hoveredZone = null;
  if (target === 'return') {
    returnCase(state, caseId);
  } else if (target && flowsById[target]) {
    const chk = canShip(state, caseId, target);
    if (chk.ok) shipCase(state, caseId, target);
    else { showToast(chk.reason); snapCardBack(); }
  } else {
    snapCardBack();
  }
}
function snapCardBack() {
  if (!UI.activeCard) return;
  UI.activeCard.slideT = 0;   // 重新滑回中心
}

canvas.addEventListener('mousedown', onMouseDown);
canvas.addEventListener('mousemove', onMouseMove);
window.addEventListener('mouseup', onMouseUp);

// ============================================================
//  加载与启动
// ============================================================
function drawLoading(msg) {
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  ctx.fillStyle = COLORS.brandRed; ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#FFFFFF'; ctx.font = '20px "Courier New"'; ctx.textAlign = 'center';
  ctx.fillText(msg, BASE_W / 2, BASE_H / 2); ctx.textAlign = 'left';
}

async function loadData() {
  const files = ['gameConfig', 'tags', 'flows', 'cases', 'shifts', 'endings'];
  const results = await Promise.all(files.map(f => fetch('data/' + f + '.json').then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' @ ' + f); return r.json();
  })));
  DATA.config = results[0]; DATA.tags = results[1]; DATA.flows = results[2];
  DATA.cases = results[3]; DATA.shifts = results[4]; DATA.endings = results[5];
  GAMECONFIG = DATA.config;
  DATA.tags.forEach(t => tagsById[t.id] = t);
  DATA.cases.forEach(c => casesById[c.id] = c);
  DATA.flows.forEach(f => flowsById[f.id] = f);
  DATA.shifts.forEach(s => shiftsById[s.id] = s);
}

(function boot() {
  drawLoading('人生标签交易所');
  document.fonts.ready.then(async () => {
    try {
      await loadData();
      const errs = validateData();
      if (errs.length) {
        console.error('配置校验失败:\n' + errs.join('\n'));
        drawLoading('配置错误，详见控制台');
        return;
      }
      STATE = { phase: 'TITLE' };   // 进入标题页
      requestAnimationFrame(gameLoop);
    } catch (err) {
      console.error(err);
      drawLoading('数据加载失败：' + err.message);
    }
  });
})();
</script>
